name: Build installer
# Every push to a claude/** branch and every manual run builds Antillusion-Setup.exe as a downloadable artifact.
# Pushing a tag like v1.1.0 also publishes it as a GitHub release, which installed copies pick up through the in-app updater.
on:
  push:
    branches: ["claude/**"]
    paths: ["antillusion/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: antillusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit
      - run: node build/build.js
      - uses: actions/upload-artifact@v4
        with:
          name: Antillusion-Setup
          path: antillusion-setup/Antillusion-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ../antillusion-setup/Antillusion-Setup.exe --title "Antillusion ${{ github.ref_name }}" --generate-notes
