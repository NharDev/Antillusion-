name: Build installer
# Builds the app payload and the tiny Antillusion-Setup.exe (a bootstrapper that downloads everything else), then
# smoke-tests a real install on Windows. Branch pushes publish/refresh the "dev-build" prerelease; v* tags publish a stable release.
on:
  push:
    branches: ["claude/**"]
    paths: ["antillusion/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'dev' }}
    defaults:
      run:
        working-directory: antillusion
    steps:
      - name: Keep LF line endings (delta updates compare packaged files with the repository)
        working-directory: .
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit
      - run: node build/build.js
      - name: Update manifests (files.json for delta updates, latest.json)
        shell: bash
        run: |
          node build/manifest.js ../antillusion-build/Antillusion-win32-x64/resources/app . ../antillusion-setup/files.json
          node -e "const fs=require('fs');const bi=JSON.parse(fs.readFileSync('build-info.json','utf8'));const fm=JSON.parse(fs.readFileSync('../antillusion-setup/files.json','utf8'));const size=fs.statSync('../antillusion-setup/Antillusion-Setup.exe').size;const wn=JSON.parse(fs.readFileSync('whats-new.json','utf8'));fs.writeFileSync('../antillusion-setup/latest.json',JSON.stringify({version:bi.version,commit:bi.commit,channel:bi.channel,builtAt:bi.builtAt,setup:'Antillusion-Setup.exe',size,files:'files.json',electron:fm.electron,release:wn[0]}));console.log(fs.readFileSync('../antillusion-setup/latest.json','utf8'))"
      - name: Installer sizes
        shell: pwsh
        run: Get-ChildItem ../antillusion-setup -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
      - name: Render the setup window (design preview frames)
        shell: powershell
        run: ./installer/setup.ps1 -Preview "$env:RUNNER_TEMP\preview"
      - name: Smoke-test a real install (downloads Node, Git and OmniRoute) with Windows PowerShell 5.1
        shell: powershell
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          ./installer/setup.ps1 -Silent -NoLaunch -ForceRuntime -Payload (Resolve-Path ../antillusion-setup/Antillusion-app-win-x64.zip).Path
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "setup exited with $LASTEXITCODE" }
          Write-Host ("foreground install (what the user waits for): {0:n1}s" -f $sw.Elapsed.TotalSeconds)
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Antillusion"
          foreach ($p in @("Antillusion.exe", "resources\app\main.js", "resources\app\build-info.json", "Uninstall-Antillusion.cmd", "runtime-setup.ps1")) {
            if (-not (Test-Path (Join-Path $dir $p))) { throw "missing after install: $p" }
          }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "Antillusion.lnk"))) { throw "desktop shortcut missing" }
          Write-Host "app installed; waiting for the background finishers (Node.js, Git)"
          # the flag file is what the app waits on too: git.exe appears early while the 7z archive is still extracting
          $deadline = (Get-Date).AddMinutes(6)
          while ((Get-Date) -lt $deadline -and ((Test-Path (Join-Path $dir "runtime\git.installing")) -or -not (Test-Path (Join-Path $dir "runtime\node\node.exe")))) { Start-Sleep -Seconds 3 }
          foreach ($p in @("runtime\node\node.exe", "runtime\git\cmd\git.exe")) { if (-not (Test-Path (Join-Path $dir $p))) { Get-Content (Join-Path $dir "runtime\setup-*.log") -ErrorAction SilentlyContinue; throw "background install missing: $p" } }
          & (Join-Path $dir "runtime\node\node.exe") -v
          & (Join-Path $dir "runtime\git\cmd\git.exe") --version
          Write-Host "install OK (OmniRoute keeps installing in the background; not awaited)"
      - uses: actions/upload-artifact@v4
        with:
          name: Antillusion-Setup
          path: |
            antillusion-setup/Antillusion-Setup.exe
            antillusion-setup/Antillusion-app-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: setup-preview
          path: ${{ runner.temp }}/preview/*.png
      - name: Publish dev-build prerelease
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build ../antillusion-setup/Antillusion-Setup.exe ../antillusion-setup/Antillusion-app-win-x64.zip ../antillusion-setup/latest.json ../antillusion-setup/files.json "$RUNNER_TEMP"/preview/*.png \
            --prerelease --target "${{ github.sha }}" --title "Antillusion dev build" \
            --notes "Latest build of branch ${{ github.ref_name }}. Download Antillusion-Setup.exe (tiny; it downloads the rest).

          commit: ${{ github.sha }}"
      - name: Live updater check against the published dev-build
        if: startsWith(github.ref, 'refs/heads/')
        run: node test/updater.live.js
      - name: Live delta update against the published files.json
        if: startsWith(github.ref, 'refs/heads/')
        run: node test/delta.live.js ../antillusion-build/Antillusion-win32-x64/resources/app
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ../antillusion-setup/Antillusion-Setup.exe ../antillusion-setup/Antillusion-app-win-x64.zip ../antillusion-setup/latest.json ../antillusion-setup/files.json --title "Antillusion ${{ github.ref_name }}" --generate-notes
