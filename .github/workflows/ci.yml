name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antillusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in main.js preload.js core/*.js ui/*.js build/*.js test/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm run test:unit
