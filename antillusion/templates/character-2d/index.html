<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Studio</title>
<style>
  :root { --bg: #0f1012; --panel: #16181b; --line: #26292e; --text: #eceae6; --muted: #8e8a84; --accent: #e0a43a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
  .stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { border-inline-start: 1px solid var(--line); background: var(--panel); padding: 18px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; } .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  h2 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button { font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer; text-transform: capitalize; }
  button:hover { border-color: #3a3e45; } button.on { border-color: var(--accent); color: var(--accent); }
  .sw { display: flex; gap: 8px; } .sw button { width: 40px; height: 40px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .sw i { display: block; height: 100%; }
  input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .row { display: flex; gap: 6px; margin-top: 8px; } .row > * { flex: 1; }
  label.r { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  input[type=range] { accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.6; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage"><canvas id="c"></canvas></div>
  <aside>
    <h1>Character Studio</h1><div class="sub">Rigged vector character · cel shaded · face rig</div>
    <h2>Animation</h2><div class="seg" id="clips"></div>
    <h2>Expression</h2><div class="seg" id="exprs"></div>
    <h2>Palette</h2><div class="sw" id="pals"></div>
    <h2>Speak (lip-sync)</h2><input type="text" id="line" value="Hello! Ready for an adventure?"><div class="row"><button id="say">Say it</button><button id="turn">Turn around</button></div>
    <h2>Stage</h2>
    <label class="r">Size <input type="range" id="size" min="0.5" max="1.6" step="0.01" value="1"></label>
    <label class="r">Time scale <input type="range" id="ts" min="0.1" max="1.5" step="0.05" value="1"></label>
    <div class="row"><button id="sheet">Export sprite sheet</button></div>
    <div class="hint">The eyes follow your pointer. Walk and run scroll the ground at the clip's speed so the feet stay planted.</div>
  </aside>
</div>
<script src="character.js"></script>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d");
const hero = Character2D.create({ palette: Character2D.PALETTES.explorer });
let W = 0, H = 0, dpr = 1, ground = 0, timeScale = 1;
function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
addEventListener("resize", resize); resize();

const el = (id) => document.getElementById(id);
const group = (host, items, on, pick) => { host.innerHTML = ""; for (const it of items) { const b = document.createElement("button"); b.textContent = it; b.className = it === on ? "on" : ""; b.onclick = () => { pick(it); [...host.children].forEach((c) => c.classList.toggle("on", c === b)); }; host.append(b); } };
group(el("clips"), Object.keys(Character2D.CLIPS), "idle", (c) => hero.play(c));
group(el("exprs"), Object.keys(Character2D.EXPR), "neutral", (e) => hero.expression(e));
for (const [name, p] of Object.entries(Character2D.PALETTES)) { const b = document.createElement("button"); b.title = name; b.innerHTML = `<i style="background:${p.top}"></i><i style="background:${p.skin}"></i>`; b.onclick = () => (hero.config.palette = p); el("pals").append(b); }
el("say").onclick = () => hero.say(el("line").value);
el("turn").onclick = () => (hero.facing *= -1);
el("size").oninput = (e) => (hero.config.scale = +e.target.value);
el("ts").oninput = (e) => (timeScale = +e.target.value);
cv.addEventListener("pointermove", (e) => hero.lookAt(e.offsetX, e.offsetY));
el("sheet").onclick = () => { const s = hero.spriteSheet(hero.clip, 12, 256); const a = document.createElement("a"); a.download = `${hero.clip}-sheet.png`; a.href = s.canvas.toDataURL("image/png"); a.click(); console.log("frames", s.frames, "fps", s.fps); };

let scroll = 0, last = performance.now();
function backdrop() {
  ground = H * 0.78;
  const sky = g.createLinearGradient(0, 0, 0, ground); sky.addColorStop(0, "#1a1c20"); sky.addColorStop(1, "#24262a");
  g.fillStyle = sky; g.fillRect(0, 0, W, ground);
  // two parallax layers of hills, then the ground with moving tick marks
  for (const [k, col, amp, base] of [[0.15, "#202226", 40, 0.62], [0.4, "#1c1e21", 26, 0.7]]) {
    g.beginPath(); g.moveTo(0, ground);
    for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, H * base - amp * (0.5 + 0.5 * Math.sin((x + scroll * k) * 0.006) * Math.cos((x + scroll * k) * 0.0023)));
    g.lineTo(W, ground); g.fillStyle = col; g.fill();
  }
  g.fillStyle = "#17181b"; g.fillRect(0, ground, W, H - ground);
  g.strokeStyle = "#2a2d32"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, ground); g.lineTo(W, ground); g.stroke();
  g.strokeStyle = "#222428"; for (let x = -((scroll % 60) + 60); x < W + 60; x += 60) { g.beginPath(); g.moveTo(x, ground + 12); g.lineTo(x + 24, ground + 12); g.stroke(); }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * timeScale; last = now;
  hero.update(dt); scroll += hero.speed() * hero.facing * dt;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); backdrop();
  hero.draw(g, W / 2, ground);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.studio = { hero };
</script>
</body>
</html>
