<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character 3D</title>
<style>
  :root { --bg: #111214; --panel: rgba(22, 23, 26, .86); --line: #2a2c31; --text: #ecebe8; --muted: #8f8c87; --accent: #e0a43a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: fixed; top: 16px; right: 16px; width: 252px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; backdrop-filter: blur(8px); }
  h1 { font-size: 14px; margin: 0; font-weight: 650; } .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  h2 { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  button { font: inherit; font-size: 12.5px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; cursor: pointer; text-transform: capitalize; }
  button:hover { border-color: #44474e; } button.on { border-color: var(--accent); color: var(--accent); }
  .sw { display: flex; gap: 6px; } .sw button { width: 34px; height: 30px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; } .sw i { display: block; }
  .keys { position: fixed; left: 16px; bottom: 14px; color: var(--muted); font-size: 12px; }
  .keys b { color: var(--text); font-weight: 600; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin: 0 2px; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="panel">
  <h1>Character 3D</h1><div class="sub">Skinned mesh · humanoid rig · blend tree</div>
  <h2>Emote</h2><div class="grid" id="emotes"></div>
  <h2>Expression</h2><div class="grid" id="exprs"></div>
  <h2>Look</h2><div class="grid" id="styles"></div>
  <h2>Palette</h2><div class="sw" id="pals"></div>
</div>
<div class="keys"><b>W A S D</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to orbit · <code>?model=file.glb</code> loads your own rigged model</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { createCharacter, PALETTES } from "./character3d.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);

const scene = new THREE.Scene(); scene.background = new THREE.Color("#1a1b1e"); scene.fog = new THREE.Fog("#1a1b1e", 9, 26);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100); camera.position.set(2.6, 1.7, 4.4);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 1.6; controls.maxDistance = 12;

// studio lighting: warm key with soft shadows, cool fill from the sky, rim from behind
scene.add(new THREE.HemisphereLight("#cfd8e6", "#2a2622", 1.1));
const key = new THREE.DirectionalLight("#fff1dc", 2.6); key.position.set(3, 5, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = key.shadow.camera.bottom = -4; key.shadow.camera.right = key.shadow.camera.top = 4; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; scene.add(key, key.target);
const rim = new THREE.DirectionalLight("#9fc4ff", 1.6); rim.position.set(-3, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: "#222326", roughness: 0.95 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(30, 30, "#2e3035", "#26282c"); grid.position.y = 0.002; scene.add(grid);

const hero = createCharacter({ palette: PALETTES.explorer, style: "toon" });
scene.add(hero.root);

// optional: your own rigged glTF (Mixamo / Ready Player Me / VRoid / Blender export) with its animations
const url = new URLSearchParams(location.search).get("model");
let custom = null;
if (url) new GLTFLoader().load(url, (g) => {
  hero.root.visible = false; custom = { root: g.scene, mixer: new THREE.AnimationMixer(g.scene), clips: g.animations };
  g.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); scene.add(g.scene);
  const host = document.getElementById("emotes"); host.innerHTML = "";
  g.animations.forEach((c, i) => { const b = document.createElement("button"); b.textContent = c.name || "clip " + i; b.onclick = () => { custom.mixer.stopAllAction(); custom.mixer.clipAction(c).reset().fadeIn(0.2).play(); }; host.append(b); });
  if (g.animations[0]) custom.mixer.clipAction(g.animations[0]).play();
}, undefined, (e) => console.error("Could not load model:", e));

/* ---------- UI ---------- */
const group = (id, items, on, pick) => { const host = document.getElementById(id); for (const it of items) { const b = document.createElement("button"); b.textContent = it; if (it === on) b.className = "on"; b.onclick = () => { pick(it); [...host.children].forEach((c) => c.classList.toggle("on", c === b)); }; host.append(b); } };
group("emotes", ["none", "wave", "punch", "dance", "jump"], "none", (n) => hero.play(n === "none" ? null : n));
group("exprs", ["neutral", "happy", "sad", "angry", "surprised"], "neutral", (n) => hero.expression(n));
group("styles", ["toon", "pbr"], "toon", (s) => hero.setStyle(s));
for (const [n, p] of Object.entries(PALETTES)) { const b = document.createElement("button"); b.title = n; b.innerHTML = `<i style="background:${p.top}"></i><i style="background:${p.skin}"></i>`; b.onclick = () => hero.setPalette(p); document.getElementById("pals").append(b); }

/* ---------- third-person movement: camera-relative input, smooth turning, speed drives the blend tree ---------- */
const keys = new Set();
addEventListener("keydown", (e) => { keys.add(e.code); if (e.code === "Space" && !hero.emote) hero.play("jump"); });
addEventListener("keyup", (e) => keys.delete(e.code));
const pointer = new THREE.Vector2(), ray = new THREE.Raycaster(), lookPoint = new THREE.Vector3();
addEventListener("pointermove", (e) => { pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(pointer, camera); ray.ray.at(camera.position.distanceTo(controls.target), lookPoint); hero.lookAt(lookPoint); });
let speed = 0, heading = 0;
const clock = new THREE.Clock(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize(); right.crossVectors(fwd, THREE.Object3D.DEFAULT_UP);
  move.set(0, 0, 0);
  if (keys.has("KeyW") || keys.has("ArrowUp")) move.add(fwd); if (keys.has("KeyS") || keys.has("ArrowDown")) move.sub(fwd);
  if (keys.has("KeyD") || keys.has("ArrowRight")) move.add(right); if (keys.has("KeyA") || keys.has("ArrowLeft")) move.sub(right);
  const want = move.lengthSq() > 0 ? (keys.has("ShiftLeft") || keys.has("ShiftRight") ? 3.9 : 1.35) : 0;
  speed += (want - speed) * (1 - Math.exp(-6 * dt));
  if (move.lengthSq() > 0) { move.normalize(); const target = Math.atan2(move.x, move.z); let d = target - heading; d = Math.atan2(Math.sin(d), Math.cos(d)); heading += d * (1 - Math.exp(-10 * dt)); }
  const r = hero.root; r.rotation.y = heading;
  r.position.x += Math.sin(heading) * speed * dt; r.position.z += Math.cos(heading) * speed * dt;
  hero.setSpeed(speed); hero.update(dt);
  if (custom) custom.mixer.update(dt);
  if (window.char3d.follow) controls.target.lerp(new THREE.Vector3(r.position.x, 0.95, r.position.z), 1 - Math.exp(-5 * dt));
  key.position.set(r.position.x + 3, 5, r.position.z + 3); key.target.position.copy(r.position);
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.char3d = { hero, scene, camera, controls, follow: true };
frame();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
