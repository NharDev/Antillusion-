<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc1f2; font-family: system-ui, "Segoe UI", sans-serif; user-select: none; }
  canvas { display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; pointer-events: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; mix-blend-mode: difference; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #hotbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: #0009; border-radius: 12px; }
  .slot { width: 46px; height: 46px; border-radius: 7px; border: 2px solid #fff3; box-sizing: border-box; position: relative; transition: transform .1s; }
  .slot.on { border-color: #fff; transform: translateY(-4px) scale(1.06); }
  .slot span { position: absolute; left: 4px; top: 1px; font: 600 11px system-ui; color: #fff; text-shadow: 0 1px 2px #000; }
  #hud { position: fixed; left: 10px; top: 8px; color: #fff; font: 12px ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; white-space: pre; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000b; color: #fff; text-align: center; cursor: pointer; }
  #start h1 { font-size: 44px; margin: 0 0 10px; letter-spacing: 1px; }
  #start p { line-height: 1.9; opacity: .9; margin: 0; }
  #start kbd { background: #fff2; border-radius: 5px; padding: 1px 7px; font: inherit; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="cross"></div>
<div id="hotbar"></div>
<div id="hud"></div>
<div id="start"><div>
  <h1>Voxel World</h1>
  <p>Click to play<br><kbd>W A S D</kbd> move · <kbd>Space</kbd> jump · <kbd>Shift</kbd> sprint · <kbd>F</kbd> fly<br>
  Left click: break · Right click: place · <kbd>1</kbd>–<kbd>6</kbd> or wheel: choose block · <kbd>Esc</kbd> release mouse</p>
</div></div>
<script type="module" src="game.js"></script>
</body>
</html>
