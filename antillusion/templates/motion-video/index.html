<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0d12; --panel: #14161d; --line: #262a36; --text: #e6e8ee; --dim: #8a90a0; --accent: #7c9cff; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px system-ui, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-rows: 1fr auto; height: 100%; }
  #stageWrap { display: grid; place-items: center; padding: 16px; min-height: 0; }
  #stage { max-width: 100%; max-height: 100%; aspect-ratio: auto; background: #000; border-radius: 10px; box-shadow: 0 20px 60px #0009; }
  #bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  button { background: #1d2130; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; } button:hover { border-color: var(--accent); } button:disabled { opacity: .5; cursor: wait; }
  button.primary { background: var(--accent); color: #0c1124; border-color: transparent; font-weight: 700; }
  #seek { flex: 1; min-width: 160px; accent-color: var(--accent); } #time { font: 13px ui-monospace, Consolas, monospace; color: var(--dim); min-width: 110px; text-align: center; }
  #status { color: var(--dim); font-size: 12.5px; flex-basis: 100%; min-height: 1.2em; }
  body.render #bar { display: none; } body.render #stageWrap { padding: 0; } body.render #stage { border-radius: 0; box-shadow: none; max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play" class="primary">▶ Play</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0.00 / 0.00</span>
    <button id="expWebm">Export WebM</button><button id="expFrames">Frames (.zip)</button><button id="expWav">Audio (.wav)</button>
    <span id="status">Space = play/pause · ←/→ = step a frame · Export records in real time with sound.</span>
  </div>
</div>
<script src="motion.js"></script>
<script src="cinematic.js"></script>
<script>
  // ?demo=cinematic loads the cinematic short film; otherwise scenes.js (the promo template). ?render=1 hides the UI (used by render.mjs).
  const q = new URLSearchParams(location.search); if (q.has("render")) document.body.classList.add("render");
  document.write('<script src="' + (q.get("demo") === "cinematic" ? "scenes-cinematic.js" : "scenes.js") + '"><\/script>');
</script>
<script>
  /* player UI — no need to edit */
  const video = M, $ = (id) => document.getElementById(id), fmt = (t) => t.toFixed(2);
  window.video = video;
  video.on((m) => { $("seek").value = Math.round((m.time / m.duration) * 1000); $("time").textContent = fmt(m.time) + " / " + fmt(m.duration); $("play").textContent = m.playing ? "❚❚ Pause" : "▶ Play"; });
  $("play").onclick = () => video.toggle(); $("seek").oninput = (e) => { video.pause(); video.seek((e.target.value / 1000) * video.duration); };
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); video.toggle(); } if (e.code === "ArrowRight") video.seek(video.time + 1 / video.fps); if (e.code === "ArrowLeft") video.seek(video.time - 1 / video.fps); });
  const busy = (on, msg) => { for (const id of ["expWebm", "expFrames", "expWav"]) $(id).disabled = on; $("status").textContent = msg || ""; };
  const stamp = () => (document.title || "video").replace(/\W+/g, "-").toLowerCase();
  $("expWebm").onclick = async () => { busy(true, "Recording in real time… keep this tab visible until it finishes."); try { const b = await video.exportWebM(); video.download(b, stamp() + ".webm"); busy(false, "Done — " + (b.size / 1048576).toFixed(1) + " MB. Convert to MP4: ffmpeg -i " + stamp() + ".webm " + stamp() + ".mp4"); } catch (e) { busy(false, "Export failed: " + e.message); } };
  $("expFrames").onclick = async () => { busy(true, "Rendering frames…"); try { const z = await video.exportFrames({ onProgress: (i, n) => ($("status").textContent = "Rendering frame " + i + " / " + n) }); video.download(z, stamp() + "-frames.zip"); busy(false, "Done. ffmpeg -framerate " + video.fps + " -i frame_%05d.jpg -c:v libx264 -pix_fmt yuv420p out.mp4"); } catch (e) { busy(false, "Export failed: " + e.message); } };
  $("expWav").onclick = async () => { busy(true, "Rendering audio…"); try { const b = await video.renderAudio(); if (!b) throw new Error("this video has no sound"); video.download(b, stamp() + ".wav"); busy(false, "Done."); } catch (e) { busy(false, e.message); } };
  video.seek(0);
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]) : Promise.resolve()).then(() => { video.seek(q.has("t") ? +q.get("t") : 0); window.__ready = true; });
</script>
</body>
</html>
